# Jazz Lost Mode backend ONLY (no website and no database files).
# IMPORTANT: This Blueprint uses a PAID Starter Web Service with a persistent
# disk. Review Render charges before creating the service.
services:
  - type: web
    name: jazz-recovery-server
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: lostmode-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: LOST_MODE_DB_PATH
        value: /var/data/lost-mode.db
      - key: LOST_MODE_PUBLIC_ORIGINS
        sync: false
      - key: LOST_MODE_COOKIE_SECURE
        value: "true"
      - key: LOST_MODE_COOKIE_SAMESITE
        value: None
      - key: LOST_MODE_TRUST_PROXY
        value: "true"
