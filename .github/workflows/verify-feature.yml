name: Verify Jazz Recovery server
on:
  pull_request:
    branches: [main, feature/recovery-enrollment-neon-20261020]
  push:
    branches: [feature/recovery-enrollment-neon-20261020, feature/fresh-registration-subscriptions-20261022]
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check src/server.mjs
      - run: node --check src/auth/password.mjs
      - run: node --check src/entrypoint.mjs
      - run: node --check src/pg/server.mjs
      - run: node --check src/pg/billing.mjs
      - run: node --test tests/*.test.mjs
