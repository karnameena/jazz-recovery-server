name: Verify Jazz Recovery server
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/recovery-enrollment-neon-20261020, feature/recovery-quality-fixes-20261023]
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
