name: Verify Jazz Recovery server
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/recovery-enrollment-20261020]
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/server.mjs
      - run: node --check src/auth/password.mjs
      - run: node --test tests/*.test.mjs
