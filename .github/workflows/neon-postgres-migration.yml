name: Jazz PostgreSQL Migration Verification
on:
  push:
    branches: [feature/neon-only-runtime-cleanup-20261024, fix/recovery-command-status-photo-20261026]
  pull_request:
  workflow_dispatch:

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: jazz-ci-password
          POSTGRES_USER: jazz_ci
          POSTGRES_DB: jazz_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jazz_ci -d jazz_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAZZ_TEST_DATABASE_URL: postgresql://jazz_ci:jazz-ci-password@127.0.0.1:5432/jazz_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install open-source dependencies
        run: npm install --no-audit --no-fund
      - name: Check entrypoint, adapter, server, migration syntax
        run: |
          node --check src/entrypoint.mjs
          node --check src/pg/database.mjs
          node --check src/pg/server.mjs
          node --check src/pg/sessions.mjs
          node --check src/scripts/dispatch.mjs
          node --check src/scripts/pg-create-owner.mjs
          node --check src/scripts/pg-create-device.mjs
          node --check src/scripts/pg-change-owner-password.mjs
          node --check src/scripts/pg-rotate-device.mjs
          node --check tests/postgres-only-runtime.test.mjs
      - name: Enforce PostgreSQL-only runtime and administration
        run: node --test tests/postgres-only-runtime.test.mjs
      - name: PostgreSQL-backed recovery workflow integration test
        run: node --test tests/postgres-migration.test.mjs
